<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarviewPH</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        header {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: white;
            border-bottom: 1px solid #161D33;
            z-index: 1000;
        }
        .contact-info {
            font-size: 16px;
            text-align: left;
            color: white;
            padding: 15px;
            margin: 15px auto;
            max-width: 950px;
            border-radius: 8px;
        }
        .contact-item {
            margin: 10px 0;
        }
        .contact-item a {
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            color: #161D33;
            font-size: 15px;
        }
        .contact-item a:hover {
            color: #EEBA2B;
        }
        .contact-label {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: bold;
            color: #161D33;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="image/logo.png" alt="Logo" class="logo1">
        </a>
    </header>
    <div class="title">CONTACT US</div>

    <div class="contact-info">
        <div class="contact-item">
            <span class="contact-label">Official Facebook Page:</span>
            <a href="https://www.facebook.com/profile.php?id=100083374380999" target="_blank">https://www.facebook.com/profile.php?id=100083374380999</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">Official Email:</span>
            <a href="mailto:carviewph@gmail.com" target="_blank">carviewph@gmail.com</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">Tiktok:</span>
            <a href="https://www.tiktok.com/@carviewph5" target="_blank">https://www.tiktok.com/@carviewph5</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">YouTube Channel:</span>
            <a href="https://www.youtube.com/@carviewph" target="_blank">https://www.youtube.com/@carviewph</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">Mobile Numbers:</span>
            <a href="tel:+09778112745">09778112745</a> / 
            <a href="tel:+09228362141">09228362141</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">Head Office:</span>
            <a href="https://maps.google.com?q=Tanza,+Cavite" target="_blank">Tanza, Cavite</a>
        </div>
    </div>

    <section class="section-blue" style="width: 100%; background-color: #161D33;">
        <img class="car-image" src="image/carviewph.png" alt="Car View">
    </section>

</body>
</html>
